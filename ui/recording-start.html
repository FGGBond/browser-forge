<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>browser-forge 录制窗口</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --ink: #101828;
      --muted: #667085;
      --line: rgba(148, 163, 184, .32);
      --card: rgba(255, 255, 255, .84);
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --red: #d92d20;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(59, 130, 246, .18), transparent 34%),
        radial-gradient(circle at 8% 18%, rgba(217, 45, 32, .10), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, #f3f6fb 55%, #eef2f7 100%);
    }
    body::before,
    body::after {
      position: fixed;
      content: '';
      width: 360px;
      height: 360px;
      border-radius: 999px;
      filter: blur(16px);
      pointer-events: none;
    }
    body::before { right: -140px; top: 12%; background: rgba(37, 99, 235, .08); }
    body::after { left: -150px; bottom: -120px; background: rgba(15, 23, 42, .07); }
    main {
      position: relative;
      width: min(760px, 100%);
      padding: 48px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 28px 80px rgba(15, 23, 42, .14), inset 0 1px 0 rgba(255, 255, 255, .9);
      backdrop-filter: blur(22px) saturate(1.15);
      animation: pageIn 420ms cubic-bezier(.16, 1, .3, 1) both;
    }
    main::after {
      position: absolute;
      content: '';
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .72), transparent 42%);
      pointer-events: none;
    }
    .content {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 16px;
      max-width: 640px;
    }
    .badge {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 13px;
      color: #b42318;
      background: rgba(255, 241, 240, .92);
      border: 1px solid #ffccc7;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .01em;
      box-shadow: 0 8px 24px rgba(217, 45, 32, .08);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(217, 45, 32, .1);
      animation: pulse 1.6s ease-in-out infinite;
    }
    h1 {
      margin: 6px 0 0;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.06;
      letter-spacing: -.055em;
    }
    p {
      margin: 0;
      color: #475467;
      font-size: 17px;
      line-height: 1.75;
    }
    form {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      padding: 8px;
      max-width: 620px;
      background: rgba(255, 255, 255, .88);
      border: 1px solid #d0d5dd;
      border-radius: 18px;
      box-shadow: 0 10px 28px rgba(16, 24, 40, .08), inset 0 1px 0 rgba(255, 255, 255, .9);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    form:focus-within {
      border-color: rgba(37, 99, 235, .65);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .12), 0 12px 32px rgba(16, 24, 40, .1);
    }
    label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    input {
      min-width: 0;
      flex: 1;
      padding: 10px 12px;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 16px;
    }
    input::placeholder { color: #667085; }
    button {
      flex: none;
      min-width: 88px;
      padding: 10px 20px;
      color: white;
      background: var(--blue);
      border: 0;
      border-radius: 12px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(37, 99, 235, .24);
      transition: background 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }
    button:hover { background: var(--blue-hover); box-shadow: 0 10px 22px rgba(37, 99, 235, .3); }
    button:active { transform: scale(.98); }
    button:focus-visible { outline: 3px solid rgba(37, 99, 235, .24); outline-offset: 2px; }
    button:disabled { cursor:wait; opacity:.58; box-shadow:none; }
    .hint {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .42; transform: scale(.84); }
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(10px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (max-width: 560px) {
      body { padding: 20px; }
      main { padding: 30px; border-radius: 22px; }
      p { font-size: 15px; }
      form { align-items: stretch; flex-direction: column; }
      button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      main, .dot { animation: none; }
      form, button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="content">
      <div class="badge"><span class="dot"></span> 正在录制这个 Chrome 窗口</div>
      <h1>打开要录制的网站</h1>
      <p>输入网址后，Browser Forge 会在当前窗口继续记录导航、点击和页面状态。</p>
      <form id="destination-form">
        <label for="destination-url">目标网址</label>
        <input
          id="destination-url"
          name="url"
          type="url"
          inputmode="url"
          autocomplete="url"
          placeholder="https://example.com"
          required
          autofocus
          spellcheck="false"
        >
        <button type="submit" disabled>开始</button>
      </form>
      <p class="hint" data-readiness aria-live="polite">正在准备录制…</p>
    </section>
  </main>
  <script>
    const recordingTitle = new URLSearchParams(window.location.search).get('bfRecordingTitle')
    if (recordingTitle) document.title = recordingTitle

    const destinationForm = document.getElementById('destination-form')
    const destinationInput = document.getElementById('destination-url')
    const startButton = destinationForm.querySelector('button[type="submit"]')
    const readiness = document.querySelector('[data-readiness]')
    let recorderReady = false

    async function waitUntilRecorderReady() {
      try {
        const response = await fetch('/api/recording-ready', { cache: 'no-store' })
        const status = response.ok ? await response.json() : null
        recorderReady = status?.ready === true
      } catch {
        recorderReady = false
      }
      startButton.disabled = !recorderReady
      readiness.textContent = recorderReady ? '录制已准备完成' : '正在准备录制…'
      if (!recorderReady) window.setTimeout(waitUntilRecorderReady, 200)
    }

    destinationForm.addEventListener('submit', event => {
      event.preventDefault()
      if (!recorderReady) return
      const destination = destinationInput.value.trim()
      try {
        const target = new URL(destination)
        if (!['http:', 'https:'].includes(target.protocol)) throw new Error('unsafe protocol')
        window.location.assign(target.href)
      } catch {
        destinationInput.setCustomValidity('请输入以 http:// 或 https:// 开头的完整网址')
        destinationInput.reportValidity()
      }
    })
    destinationInput.addEventListener('input', () => destinationInput.setCustomValidity(''))
    waitUntilRecorderReady()
  </script>
</body>
</html>
