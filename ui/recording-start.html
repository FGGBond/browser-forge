<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>browser-forge 录制窗口</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: light;
      --ink: #101828;
      --muted: #667085;
      --line: rgba(148, 163, 184, .28);
      --card: rgba(255, 255, 255, .82);
      --blue: #2563eb;
      --red: #d92d20;
    }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(59, 130, 246, .18), transparent 34%),
        radial-gradient(circle at 8% 18%, rgba(217, 45, 32, .10), transparent 28%),
        linear-gradient(180deg, #f8fbff 0%, #f3f6fb 55%, #eef2f7 100%);
    }
    body::before,
    body::after {
      position: fixed;
      content: '';
      width: 360px;
      height: 360px;
      border-radius: 999px;
      filter: blur(16px);
      pointer-events: none;
    }
    body::before { right: -140px; top: 12%; background: rgba(37, 99, 235, .08); }
    body::after { left: -150px; bottom: -120px; background: rgba(15, 23, 42, .07); }
    main {
      position: relative;
      width: min(760px, 100%);
      padding: 48px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 28px 80px rgba(15, 23, 42, .14), inset 0 1px 0 rgba(255, 255, 255, .9);
      backdrop-filter: blur(22px) saturate(1.15);
      animation: pageIn 420ms cubic-bezier(.16, 1, .3, 1) both;
    }
    main::after {
      position: absolute;
      content: '';
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, .72), transparent 42%);
      pointer-events: none;
    }
    .content { position: relative; z-index: 1; display: grid; gap: 16px; max-width: 640px; }
    .badge {
      width: fit-content;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 13px;
      color: #b42318;
      background: rgba(255, 241, 240, .92);
      border: 1px solid #ffccc7;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .01em;
      box-shadow: 0 8px 24px rgba(217, 45, 32, .08);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(217, 45, 32, .1);
      animation: pulse 1.6s ease-in-out infinite;
    }
    h1 { margin: 6px 0 0; font-size: clamp(34px, 5vw, 52px); line-height: 1.06; letter-spacing: -.055em; }
    p { margin: 0; color: #475467; font-size: 17px; line-height: 1.75; }
    .address-guide {
      margin: 12px 0 2px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      max-width: 520px;
      color: #98a2b3;
      background: rgba(248, 250, 252, .86);
      border: 1px solid #e4e7ec;
      border-radius: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85);
    }
    .address-guide span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .kbd {
      flex: none;
      padding: 3px 7px;
      color: #667085;
      background: white;
      border: 1px solid #d0d5dd;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
    }
    .hint {
      margin-top: 12px;
      padding: 16px 18px;
      color: var(--muted);
      background: rgba(248, 250, 252, .78);
      border: 1px solid #e5e7eb;
      border-radius: 18px;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .42; transform: scale(.84); } }
    @keyframes pageIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 560px) {
      body { padding: 20px; }
      main { padding: 30px; border-radius: 22px; }
      p { font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      main, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="content">
      <div class="badge"><span class="dot"></span> 正在录制这个 Chrome 窗口</div>
      <h1>这是正在录制的 Chrome 窗口</h1>
      <p>请在地址栏输入目标网站，或从当前页面开始操作。browser-forge 会记录这个窗口中的导航、点击和页面状态。</p>
      <div class="address-guide" aria-hidden="true">
        <span>https://example.com</span>
        <div class="kbd">⌘L</div>
      </div>
      <p class="hint">录制过程中请保持此窗口打开。完成后回到 browser-forge 控制台停止录制。</p>
    </section>
  </main>
  <script>
    const recordingTitle = new URLSearchParams(window.location.search).get('bfRecordingTitle')
    if (recordingTitle) document.title = recordingTitle
  </script>
</body>
</html>
